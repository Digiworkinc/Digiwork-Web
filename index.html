                </button>

                <h3 className="font-['Syne',sans-serif] text-3xl font-extrabold text-[#e1e3e4]">{t.contactModalTitle}</h3>

                <div className="space-y-4">
                  <a href="https://wa.me/628123456789" target="_blank" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-mono font-bold text-xs rounded-xl flex items-center justify-center gap-2">
                    💬 {t.whatsappBtn}
                  </a>
                  <a href="mailto:eleazaragungnugroho@gmail.com" className="w-full py-3.5 bg-[#cae2eb] hover:bg-[#b0d2df] text-[#1a1c1d] font-mono font-bold text-xs rounded-xl flex items-center justify-center gap-2">
                    ✉️ {t.sendMessageBtn}
                  </a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
