    function PixelMarioFooter() {
      const [marioX, setMarioX] = useState(0);
      const [marioY, setMarioY] = useState(0);
      const [direction, setDirection] = useState('right');
      const [isJumping, setIsJumping] = useState(false);
      const [walkFrame, setWalkFrame] = useState(0);
      const [goombaX, setGoombaX] = useState(70);
      const [goombaDead, setGoombaDead] = useState(false);
      const [floatingTexts, setFloatingTexts] = useState([]);
      const [blocks, setBlocks] = useState([
        { id: 1, xPct: 22, hit: false, item: '🪙 +100' },
        { id: 2, xPct: 48, hit: false, item: '⭐️ STAR' },
        { id: 3, xPct: 75, hit: false, item: '🪙 +100' },
      ]);

      const requestRef = React.useRef(null);

      const triggerAutoJump = (height = 36) => {
        if (isJumping) return;
        setIsJumping(true);

        let currentY = 0;
        let vel = 10;

        const interval = setInterval(() => {
          currentY += vel;
          vel -= 0.7;

          if (currentY <= 0) {
            setMarioY(0);
            setIsJumping(false);
            clearInterval(interval);
          } else {
            setMarioY(Math.min(currentY, height));
          }
        }, 16);
      };

      useEffect(() => {
        let lastTime = performance.now();
        const update = (time) => {
          const delta = (time - lastTime) / 1000;
          lastTime = time;

          setMarioX((prevX) => {
            const speed = 12;
            if (direction === 'right') {
              let nextX = prevX + speed * delta;
              if (nextX >= 96) {
                setDirection('left');
                setBlocks((bList) => bList.map((b) => ({ ...b, hit: false })));
                return 96;
              }
              return nextX;
            } else {
              let nextX = prevX - speed * delta;
              if (nextX <= 2) {
                setDirection('right');
                setBlocks((bList) => bList.map((b) => ({ ...b, hit: false })));
                return 2;
              }
              return nextX;
            }
          });

          if (!goombaDead) {
            setGoombaX((prevG) => {
              let nextG = prevG - 6 * delta;
              if (nextG <= 5) return 88;
              return nextG;
            });
          }

          setWalkFrame((prev) => (prev + 1) % 4);
          requestRef.current = requestAnimationFrame(update);
        };

        requestRef.current = requestAnimationFrame(update);
        return () => {
          if (requestRef.current) cancelAnimationFrame(requestRef.current);
        };
      }, [direction, goombaDead]);

      useEffect(() => {
        blocks.forEach((block) => {
          const dist = Math.abs(marioX - block.xPct);
          if (!block.hit && dist < 2.5 && !isJumping) {
            triggerAutoJump(42);
          }

          if (!block.hit && dist < 3.5 && marioY > 25) {
            setBlocks((prev) => prev.map((b) => (b.id === block.id ? { ...b, hit: true } : b)));
            addFloatingText(block.item, block.xPct, 80);
          }
        });

        if (!goombaDead) {
          const gDist = Math.abs(marioX - goombaX);
          if (gDist < 6 && gDist > 2 && !isJumping) {
            triggerAutoJump(30);
          }

          if (gDist < 3 && marioY > 10) {
            setGoombaDead(true);
            addFloatingText('✦ 500', goombaX, 35);
            setTimeout(() => {
              setGoombaDead(false);
              setGoombaX(90);
            }, 3500);
          }
        }
      }, [marioX, marioY, blocks, goombaX, goombaDead, isJumping]);

      const addFloatingText = (text, x, y) => {
        const id = Date.now() + Math.random();
        setFloatingTexts((prev) => [...prev, { id, text, x, y }]);
        setTimeout(() => {
          setFloatingTexts((prev) => prev.filter((t) => t.id !== id));
        }, 1000);
      };

      return (
        <div className="w-full bg-[#121415] border-t border-[#323536] pt-3 pb-1 relative overflow-hidden select-none font-mono">
          <div className="max-w-[1440px] mx-auto px-6 mb-2 flex items-center justify-between text-[11px] text-[#a0a0a0] font-bold tracking-widest uppercase">
            <div className="flex items-center gap-6">
              <div className="flex items-center gap-2">
                <span className="text-white">MARIO</span>
                <span className="text-[#a0a0a0]">LOOP 1-1</span>
              </div>
              <div className="flex items-center gap-1">
                <span className="text-white">WORLD</span>
                <span className="text-[#a0a0a0]">BLACK & WHITE</span>
              </div>
            </div>
            <div className="text-[10px] text-[#707070] tracking-wider hidden sm:block">
              AUTOMATIC PIXEL LOOP • MONOCHROME
            </div>
          </div>

          {floatingTexts.map((item) => (
            <div
              key={item.id}
              className="absolute z-30 font-bold text-[10px] text-white bg-black/90 px-2 py-0.5 rounded border border-white/60 animate-bounce pointer-events-none transition-all"
              style={{ left: `${item.x}%`, bottom: `${item.y}px`, transform: 'translateX(-50%)' }}
            >
              {item.text}
            </div>
          ))}

          <div className="relative w-full h-20 bg-[#1a1c1d] border-b-4 border-white/80 overflow-hidden">
            <div className="absolute inset-0 opacity-20 pointer-events-none">
              <div className="absolute top-2 left-[15%] text-[8px] text-white">✦</div>
              <div className="absolute top-4 left-[40%] text-[8px] text-white">✦</div>
              <div className="absolute top-2 left-[70%] text-[8px] text-white">✦</div>
              <div className="absolute top-5 left-[90%] text-[8px] text-white">✦</div>
            </div>

            {blocks.map((block) => (
              <div
                key={block.id}
                className={`absolute bottom-11 w-7 h-7 rounded-none border border-white flex items-center justify-center pointer-events-none ${
                  block.hit ? 'bg-[#2a2d2f] text-[#606060]' : 'bg-white text-black font-black animate-pulse'
                }`}
                style={{ left: `${block.xPct}%`, transform: 'translateX(-50%)' }}
              >
                <span className="text-xs">{block.hit ? '' : '?'}</span>
              </div>
            ))}

            {!goombaDead ? (
              <div className="absolute bottom-0 w-6 h-6 transition-all pointer-events-none" style={{ left: `${goombaX}%`, transform: 'translateX(-50%)' }}>
                <svg viewBox="0 0 16 16" className="w-full h-full">
                  <path d="M4 2 h8 v2 h4 v6 h-16 v-6 h4 z" fill="#ffffff" />
                  <rect x="3" y="6" width="3" height="3" fill="#000000" />
                  <rect x="10" y="6" width="3" height="3" fill="#000000" />
                  <rect x="4" y="7" width="1" height="2" fill="#ffffff" />
                  <rect x="11" y="7" width="1" height="2" fill="#ffffff" />
                  <rect x="1" y="12" width="5" height="4" fill="#ffffff" />
                  <rect x="10" y="12" width="5" height="4" fill="#ffffff" />
                </svg>
              </div>
            ) : (
              <div className="absolute bottom-0 w-7 h-1.5 bg-white/60 pointer-events-none" style={{ left: `${goombaX}%`, transform: 'translateX(-50%)' }}></div>
            )}

            <div
              className="absolute bottom-0 w-7 h-9 transition-all duration-75 pointer-events-none z-20"
              style={{
                left: `${marioX}%`,
                bottom: `${marioY}px`,
                transform: `translateX(-50%) scaleX(${direction === 'left' ? -1 : 1})`,
              }}
            >
              <svg viewBox="0 0 16 16" className="w-full h-full">
                <rect x="3" y="1" width="6" height="1" fill="#ffffff" />
                <rect x="2" y="2" width="9" height="1" fill="#ffffff" />
                <rect x="2" y="3" width="3" height="1" fill="#888888" />
                <rect x="5" y="3" width="2" height="1" fill="#ffffff" />
                <rect x="7" y="3" width="1" height="1" fill="#000000" />
                <rect x="8" y="3" width="1" height="1" fill="#ffffff" />
                <rect x="1" y="4" width="1" height="3" fill="#888888" />
                <rect x="2" y="4" width="1" height="1" fill="#ffffff" />
                <rect x="3" y="4" width="1" height="1" fill="#888888" />
                <rect x="4" y="4" width="3" height="1" fill="#ffffff" />
                <rect x="7" y="4" width="1" height="1" fill="#888888" />
                <rect x="8" y="4" width="3" height="1" fill="#ffffff" />
                <rect x="2" y="5" width="1" height="1" fill="#ffffff" />
                <rect x="3" y="5" width="5" height="1" fill="#000000" />
                <rect x="8" y="5" width="2" height="1" fill="#ffffff" />
                <rect x="3" y="6" width="7" height="1" fill="#ffffff" />

                {isJumping ? (
                  <>
                    <rect x="1" y="7" width="2" height="2" fill="#ffffff" />
                    <rect x="3" y="7" width="5" height="3" fill="#666666" />
                    <rect x="8" y="7" width="2" height="2" fill="#ffffff" />
                    <rect x="4" y="10" width="3" height="2" fill="#666666" />
                    <rect x="4" y="8" width="1" height="1" fill="#ffffff" />
                    <rect x="6" y="8" width="1" height="1" fill="#ffffff" />
                    <rect x="2" y="12" width="3" height="3" fill="#000000" />
                    <rect x="8" y="12" width="3" height="3" fill="#000000" />
                  </>
                ) : walkFrame % 2 === 0 ? (
                  <>
                    <rect x="2" y="7" width="2" height="3" fill="#ffffff" />
                    <rect x="4" y="7" width="3" height="4" fill="#666666" />
                    <rect x="7" y="7" width="2" height="3" fill="#ffffff" />
                    <rect x="4" y="8" width="1" height="1" fill="#ffffff" />
                    <rect x="6" y="8" width="1" height="1" fill="#ffffff" />
                    <rect x="3" y="11" width="2" height="4" fill="#000000" />
                    <rect x="6" y="11" width="3" height="4" fill="#000000" />
                  </>
                ) : (
                  <>
                    <rect x="2" y="7" width="2" height="3" fill="#ffffff" />
                    <rect x="4" y="7" width="3" height="4" fill="#666666" />
                    <rect x="7" y="7" width="2" height="3" fill="#ffffff" />
                    <rect x="4" y="8" width="1" height="1" fill="#ffffff" />
