<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Griya Bugar - Pijat Sehat Keluarga & Refleksologi</title>
  
  <!-- Tailwind CSS (Styling) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel (Aplikasi React Tanpa Install) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans">

  <div id="root"></div>

  <!-- Script Aplikasi React + Firebase Real-time -->
  <script type="babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      doc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // =========================================================
    // 1. ISI DENGAN KONFIGURASI FIREBASE ANDA SENDIRI
    // (Dapatkan gratis dari https://console.firebase.google.com)
    // =========================================================
    const firebaseConfig = {
      apiKey: "PASTE_API_KEY_FIREBASE_ANDA",
      authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
      projectId: "PASTE_PROJECT_ID",
      storageBucket: "PASTE_PROJECT_ID.appspot.com",
      messagingSenderId: "PASTE_SENDER_ID",
      appId: "PASTE_APP_ID"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const { useState, useEffect } = React;

    function App() {
      const [services, setServices] = useState([]);
      const [bookings, setBookings] = useState([]);
      const [announcement, setAnnouncement] = useState('');
      
      // State Form Reservasi
      const [nama, setNama] = useState('');
      const [layananPilihan, setLayananPilihan] = useState('');
      const [jam, setJam] = useState('');
      const [nomorWA, setNomorWA] = useState('');

      // Toast Notifikasi
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 4000);
      };

      // Login Anonim & Listener Real-time
      useEffect(() => {
        signInAnonymously(auth).catch(err => console.error("Firebase Auth Error:", err));

        // Listener Real-time Layanan
        const unsubServices = onSnapshot(collection(db, "services"), (snapshot) => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          
          if (list.length === 0) {
            // Default jika database masih kosong
            setServices([
              { id: '1', nama: 'Massage Tradisional Jawa', durasi: '60 Menit', harga: 120000, deskripsi: 'Pijat urut tradisional merelaksasi otot kaku.' },
              { id: '2', nama: 'Refleksologi Kaki Kerajaan', durasi: '45 Menit', harga: 80000, deskripsi: 'Penekanan titik syaraf kaki mengurangi kelelahan.' },
              { id: '3', nama: 'Shiatsu Healing Massage', durasi: '90 Menit', harga: 180000, deskripsi: 'Terapi pemijatan tanpa minyak gaya Jepang.' }
            ]);
          } else {
            setServices(list);
          }
        });

        // Listener Real-time Antrean
        const unsubBookings = onSnapshot(collection(db, "bookings"), (snapshot) => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setBookings(list);
        });

        // Listener Real-time Pengumuman
        const unsubAnn = onSnapshot(collection(db, "announcements"), (snapshot) => {
          snapshot.forEach(doc => {
            if (doc.id === 'broadcast_utama') {
              setAnnouncement(doc.data().teks || '');
            }
          });
        });

        return () => {
          unsubServices();
          unsubBookings();
          unsubAnn();
        };
      }, []);

      // Kirim Reservasi Baru ke Cloud Database
      const handleSubmitBooking = async (e) => {
        e.preventDefault();
        if (!nama || !layananPilihan || !jam || !nomorWA) {
          showToast("Mohon lengkapi seluruh formulir!", "error");
          return;
        }

        try {
          await addDoc(collection(db, "bookings"), {
            namaPelanggan: nama,
            layanan: layananPilihan,
            jam: jam,
            nomorWA: nomorWA,
            status: 'Antre',
            createdAt: Date.now()
          });

          showToast(`Terima kasih ${nama}, reservasi Anda berhasil terkirim ke Dashboard Admin!`);
          setNama('');
          setJam('');
          setNomorWA('');
          setLayananPilihan('');
        } catch (err) {
          console.error(err);
          showToast("Gagal mengirim reservasi.", "error");
        }
      };

      const formatRupiah = (angka) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
      };

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* BAR PENGUMUMAN REAL-TIME */}
          {announcement && (
            <div className="bg-amber-400 text-stone-950 font-bold py-2 px-4 text-xs md:text-sm text-center shadow-inner">
              📢 <span className="uppercase tracking-wider font-extrabold mr-1">INFO LIVE:</span> {announcement}
            </div>
          )}

          {/* HEADER / NAVBAR */}
          <header className="bg-emerald-900 text-white shadow-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <img 
                  src="logo griya bugar.png" 
                  alt="Logo Griya Bugar" 
                  className="w-10 h-10 object-contain rounded-full bg-white/10 p-1"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
                <div>
                  <h1 className="text-xl font-bold tracking-tight">Griya Bugar</h1>
                  <p className="text-[10px] text-emerald-300 uppercase font-medium">Pijat Sehat Keluarga</p>
                </div>
              </div>

              <a 
                href="#reservasi" 
                className="bg-amber-400 hover:bg-amber-300 text-emerald-950 font-bold px-4 py-2 rounded-xl text-xs md:text-sm transition"
              >
                Pesan Sekarang
              </a>
            </div>
          </header>

          {/* TOAST NOTIFIKASI */}
          {toast.show && (
            <div className={`fixed top-16 right-4 z-50 p-4 rounded-xl shadow-xl border ${
              toast.type === 'error' ? 'bg-red-50 text-red-800' : 'bg-emerald-50 text-emerald-900'
            }`}>
              <span className="text-sm font-semibold">{toast.message}</span>
            </div>
          )}

          {/* HERO SECTION */}
          <section className="bg-emerald-900 text-white py-16 px-6">
            <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-10 items-center">
              <div>
                <span className="bg-emerald-800 text-emerald-300 text-xs font-bold px-3 py-1.5 rounded-full inline-block mb-4">
                  🌿 Rileksasi & Refleksologi Terbaik
                </span>
                <h2 className="text-3xl md:text-5xl font-extrabold leading-tight mb-4">
                  Kembalikan Kebugaran Tubuh Anda Bersama Terapis Ahli
                </h2>
                <p className="text-emerald-200 text-sm mb-8">
                  Nikmati pijat kesehatan dan perawatan tubuh menyeluruh dengan suasana nyaman dan higienis.
                </p>
                <a 
                  href="#reservasi" 
                  className="bg-amber-400 text-emerald-950 font-extrabold px-6 py-3 rounded-xl text-sm transition shadow-lg inline-block"
                >
                  Reservasi Online Sekarang
                </a>
              </div>

              {/* WIDGET MONITOR ANTREAN REALTIME */}
              <div className="bg-emerald-950/80 border border-emerald-800 p-6 rounded-3xl shadow-xl">
                <div className="flex justify-between items-center mb-4 border-b border-emerald-800 pb-3">
                  <span className="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    Status Antrean Saat Ini (Live Sync)
                  </span>
                </div>

                <div className="space-y-3">
                  <div className="flex justify-between items-center bg-emerald-900/50 p-3 rounded-xl">
                    <span className="text-xs text-emerald-200">Sedang Dalam Terapi:</span>
                    <span className="text-sm font-bold text-amber-300">
                      {bookings.filter(b => b.status === 'Diproses').length} Ruang Aktif
                    </span>
                  </div>
                  <div className="flex justify-between items-center bg-emerald-900/50 p-3 rounded-xl">
                    <span className="text-xs text-emerald-200">Dalam Antrean Menunggu:</span>
                    <span className="text-sm font-bold text-emerald-100">
                      {bookings.filter(b => b.status === 'Antre').length} Orang
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* DAFTAR LAYANAN */}
          <section className="py-16 px-6 max-w-7xl mx-auto w-full">
            <h2 className="text-2xl font-extrabold text-center mb-8">Daftar Layanan & Harga</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {services.map((item) => (
                <div key={item.id} className="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm flex flex-col justify-between">
                  <div>
                    <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-1 rounded mb-2 inline-block">
                      ⏱️ {item.durasi || '60m'}
                    </span>
                    <h3 className="font-bold text-stone-900 text-lg mb-2">{item.nama}</h3>
                    <p className="text-stone-500 text-xs mb-4">{item.deskripsi}</p>
                  </div>
                  <div className="border-t pt-4 flex items-center justify-between">
                    <span className="text-base font-extrabold text-emerald-800">{formatRupiah(item.harga)}</span>
                    <a href="#reservasi" onClick={() => setLayananPilihan(item.nama)} className="bg-stone-900 text-white text-xs font-bold px-3 py-2 rounded-lg">Pilih</a>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* FORM RESERVASI */}
          <section id="reservasi" className="py-16 px-6 bg-emerald-950 text-white">
            <div className="max-w-2xl mx-auto bg-stone-900 p-8 rounded-3xl border border-emerald-800">
              <h2 className="text-2xl font-bold mb-6 text-center">Formulir Reservasi Online</h2>
              <form onSubmit={handleSubmitBooking} className="space-y-4">
                <input 
                  type="text" 
                  placeholder="Nama Lengkap"
                  value={nama}
                  onChange={(e) => setNama(e.target.value)}
                  className="w-full bg-stone-800 border border-stone-700 p-3 rounded-xl text-sm text-white outline-none"
                />
                <input 
                  type="text" 
                  placeholder="Nomor WhatsApp"
                  value={nomorWA}
                  onChange={(e) => setNomorWA(e.target.value)}
                  className="w-full bg-stone-800 border border-stone-700 p-3 rounded-xl text-sm text-white outline-none"
                />
                <select 
                  value={layananPilihan}
                  onChange={(e) => setLayananPilihan(e.target.value)}
                  className="w-full bg-stone-800 border border-stone-700 p-3 rounded-xl text-sm text-white outline-none"
                >
                  <option value="">-- Pilih Layanan --</option>
                  {services.map((s) => (
                    <option key={s.id} value={s.nama}>{s.nama} ({formatRupiah(s.harga)})</option>
                  ))}
                </select>
                <input 
                  type="text" 
                  placeholder="Rencana Jam Kedatangan (misal: 15:00 WIB)"
                  value={jam}
                  onChange={(e) => setJam(e.target.value)}
                  className="w-full bg-stone-800 border border-stone-700 p-3 rounded-xl text-sm text-white outline-none"
                />
                <button type="submit" className="w-full bg-amber-400 text-emerald-950 font-black py-3 rounded-xl text-sm">
                  Kirim Reservasi Sekarang
                </button>
              </form>
            </div>
          </section>

          <footer className="bg-stone-900 text-stone-500 py-6 text-center text-xs">
            Griya Bugar © Real-time Cloud Application
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
