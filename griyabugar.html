            };

            const triggerConfirm = (title, message, onConfirm) => {

                    onConfirm: () => {

                    }

            const triggerAlert = (title, message) => {

                    message,
                    showCancel: false,
                    onConfirm: () => setDialogConfig(null)
                });
            };

            // URL Hash Change Listener (Secret Admin Route: #admin)
            useEffect(() => {
                const handleHashChange = () => {
                    if (window.location.hash === '#admin') {
                        setCurrentPage('admin');
                        showToast("Sistem Konsol", "Membuka halaman administrator pusat.", "success");
                    }
                };

                handleHashChange();
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            useEffect(() => {
                let unsubBranches, unsubSettings, unsubBookings;

                const initAppAndFirebase = async () => {
                    // 1. Load Local Storage Backup
                    const localBranches = localStorage.getItem('gb_branches_v5');
                    const localSettings = localStorage.getItem('gb_settings_v5');
                    const localBookings = localStorage.getItem('gb_bookings_v5');

                    if (localBranches) setBranches(JSON.parse(localBranches));
                    if (localSettings) {
                        setSettings(JSON.parse(localSettings));
                        setTempSettings(JSON.parse(localSettings));
                    }
                    if (localBookings) setBookingLogs(JSON.parse(localBookings));

                    // 2. Initialize Firebase Cloud Sync
                    try {
                        let firebaseConfig = MANUAL_FIREBASE_CONFIG;

                        if (!firebaseConfig) {
                            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                                firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                            } else {
                                const savedFbConfig = localStorage.getItem('gb_custom_fb_config');
                                if (savedFbConfig) {
                                    firebaseConfig = JSON.parse(savedFbConfig);
                                    setCustomFbConfig(savedFbConfig);
                                }
                            }
                        } else {
                            setCustomFbConfig(JSON.stringify(MANUAL_FIREBASE_CONFIG, null, 2));
                        }

                        if (firebaseConfig && typeof firebase !== 'undefined') {
                            if (!firebase.apps.length) {
                                firebase.initializeApp(firebaseConfig);
                            }
                            
                            const db = firebase.firestore();
                            const auth = firebase.auth();

                            if (!auth.currentUser) {
                                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                    await auth.signInWithCustomToken(__initial_auth_token);
                                } else {
                                    await auth.signInAnonymously();
                                }
                            }

                            const appId = typeof __app_id !== 'undefined' ? __app_id : 'griya-bugar-app';
                            setFb({ db, auth, appId });
                            setIsFirebaseConnected(true);

                            // Real-time Firestore Branches Listener
                            const branchesRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('branches');
                            unsubBranches = branchesRef.onSnapshot((snap) => {
                                if (snap.empty) {
                                    INITIAL_BRANCHES.forEach(b => branchesRef.doc(b.id).set(b));
                                } else {
                                    const loadedBranches = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                    setBranches(loadedBranches);
                                    localStorage.setItem('gb_branches_v5', JSON.stringify(loadedBranches));
                                }
                            }, console.error);

                            // Real-time Firestore Settings Listener
                            const settingsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('settings');
                            unsubSettings = settingsRef.onSnapshot((snap) => {
                                const configDoc = snap.docs.find(d => d.id === 'config');
                                if (configDoc) {
                                    const data = configDoc.data();
                                    setSettings(data);
                                    setTempSettings(data);
                                    localStorage.setItem('gb_settings_v5', JSON.stringify(data));
                                } else if (snap.empty) {
                                    settingsRef.doc('config').set(DEFAULT_SETTINGS);
                                }
                            }, console.error);

                            // Real-time Firestore Booking Logs Listener
                            const bookingsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('bookings');
                            unsubBookings = bookingsRef.onSnapshot((snap) => {
                                const loadedBookings = snap.docs.map(doc => ({ fbId: doc.id, ...doc.data() }));
                                loadedBookings.sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                                setBookingLogs(loadedBookings);
                                localStorage.setItem('gb_bookings_v5', JSON.stringify(loadedBookings));
                            }, console.error);
                        }
                    } catch (err) {
                        console.warn("Running in Offline/Local Mode (Firebase disabled or not configured):", err);
                    }

                    setTimeout(() => {
                        setIsLocationPromptOpen(true);
                    }, 3000);
                };

                initAppAndFirebase();

                return () => {
                    if (unsubBranches) unsubBranches();
                    if (unsubSettings) unsubSettings();
                    if (unsubBookings) unsubBookings();
                };
            }, []);

                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let randomPart = '';
                for (let i = 0; i < 4; i++) {
                    randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                const today = new Date();
                const datePart = today.getFullYear() + 
                                 String(today.getMonth() + 1).padStart(2, '0') + 
                                 String(today.getDate()).padStart(2, '0');
                
                return `GB-${datePart}-${randomPart}`;
            };

                    triggerAlert("Data Tidak Lengkap", "Silakan pilih cabang terlebih dahulu.");
                    return;

                let message = settings.template;
                message = message.replace(/\[KODE\]/g, uniqueCode);
                message = message.replace(/\[NAMA\]/g, formData.name);
                message = message.replace(/\[TELEPON\]/g, formData.phone);
                message = message.replace(/\[CABANG\]/g, currentBranchObj.name + ` (${currentBranchObj.region})`);
                message = message.replace(/\[TANGGAL\]/g, formattedDate);
                message = message.replace(/\[JAM\]/g, formData.time + ' WIB');
                message = message.replace(/\[LAYANAN\]/g, formData.service);
                message = message.replace(/\[HARGA\]/g, formattedPrice);
                message = message.replace(/\[CATATAN\]/g, formData.notes || '-');

                const branchPhoneNum = currentBranchObj.phone || settings.whatsapp;
                const sanitizedPhone = branchPhoneNum.replace(/[^0-9]/g, '');
                const finalPhone = sanitizedPhone.startsWith('0') ? '62' + sanitizedPhone.substring(1) : sanitizedPhone;

                const waLink = `https://api.whatsapp.com/send?phone=${finalPhone}&text=${encodeURIComponent(message)}`;
                
                const bookingRecord = {
                    code: uniqueCode,
                    timestamp: new Date().toLocaleString('id-ID'),
                    createdAt: new Date().toISOString(),
                    customerName: formData.name,
                    customerPhone: formData.phone,

                    totalPrice: currentPrice,
                    notes: formData.notes || '-'
                };

                                                    <div className="space-y-1.5 flex gap-2">
                                                        <div className="w-full">
                                                            <label className="text-slate-400 font-bold uppercase">Harga (Rupiah)</label>
                                                            <input type="number" required value={newBranch.price} onChange={(e) => setNewBranch({ ...newBranch, price: e.target.value })} placeholder="127500" className="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:ring-1 focus:ring-brandGold" />
                                                        </div>
                                                        <button type="submit" className="bg-brandGold hover:bg-brandGoldDark text-slate-950 font-bold px-3 py-2 rounded-lg shrink-0 flex items-center justify-center"><Plus size={16} /></button>
                                                    </div>
                                                </form>

                                                <div className="overflow-x-auto border border-slate-700 rounded-2xl text-xs">
                                                    <table className="w-full text-left">
                                                        <thead className="bg-slate-900 text-slate-300 font-bold uppercase">
                                                            <tr>
                                                                <th className="px-4 py-3">Cabang</th>
                                                                <th className="px-4 py-3">Wilayah</th>
                                                                <th className="px-4 py-3">Alamat</th>
                                                                <th className="px-4 py-3">Harga Web</th>
                                                                <th className="px-4 py-3 text-right">Aksi</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-800">
                                                            {branches.map(b => {
                                                                const isEditing = editingBranchId === b.id;
                                                                return (
                                                                    <tr key={b.id} className="hover:bg-slate-800/40 transition">
                                                                        <td className="px-4 py-3 font-semibold text-brandGold">
                                                                            {isEditing ? <input type="text" value={editingBranchData.name} onChange={(e) => setEditingBranchData({ ...editingBranchData, name: e.target.value })} className="px-2 py-1 rounded bg-slate-700 text-white w-full" /> : b.name}
                                                                        </td>
                                                                        <td className="px-4 py-3">
                                                                            {isEditing ? (
                                                                                <select value={editingBranchData.region} onChange={(e) => setEditingBranchData({ ...editingBranchData, region: e.target.value })} className="px-2 py-1 rounded bg-slate-700 text-white">
                                                                                    <option value="Yogyakarta">Yogyakarta</option>
                                                                                    <option value="Solo">Solo</option>
                                                                                    <option value="Malang">Malang</option>
                                                                                    <option value="Semarang">Semarang</option>
                                                                                    <option value="Bali">Bali</option>
                                                                                </select>
                                                                            ) : b.region}
                                                                        </td>
                                                                        <td className="px-4 py-3 text-slate-400">
                                                                            {isEditing ? <input type="text" value={editingBranchData.address} onChange={(e) => setEditingBranchData({ ...editingBranchData, address: e.target.value })} className="px-2 py-1 rounded bg-slate-700 text-white w-full" /> : b.address}
                                                                        </td>
                                                                        <td className="px-4 py-3 font-mono font-bold text-brandGold">
                                                                            {isEditing ? <input type="number" value={editingBranchData.price} onChange={(e) => setEditingBranchData({ ...editingBranchData, price: e.target.value })} className="px-2 py-1 rounded bg-slate-700 text-white w-24" /> : formatIDR(b.price)}
                                                                        </td>
                                                                        <td className="px-4 py-3 text-right">
                                                                            <div className="flex justify-end gap-2">
                                                                                {isEditing ? (
                                                                                    <>
                                                                                        <button onClick={() => handleSaveEditBranch(b.id)} className="p-1 text-emerald-400 hover:bg-slate-700 rounded"><Save size={14} /></button>
                                                                                        <button onClick={() => setEditingBranchId(null)} className="p-1 text-slate-400 hover:bg-slate-700 rounded"><X size={14} /></button>
                                                                                    </>
                                                                                ) : (
                                                                                    <>
                                                                                        <button onClick={() => startEditBranch(b)} className="p-1 text-blue-400 hover:bg-slate-700 rounded"><Edit2 size={14} /></button>
                                                                                        <button onClick={() => handleDeleteBranch(b.id, b.name)} className="p-1 text-rose-400 hover:bg-slate-700 rounded"><Trash2 size={14} /></button>
                                                                                    </>
                                                                                )}
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                );
                                                            })}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>

                                        </div>
                                    )}

                                </div>
                            </div>
                        )}

                    </main>

                    {/* FOOTER */}
                    <footer className="bg-brandBrown text-brandCream pt-16 pb-12 border-t border-brandGold/20 mt-auto">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-brandCream/60 gap-4">
                            <p 
                                onDoubleClick={() => {
                                    setCurrentPage('admin');
                                    showToast("Sistem Konsol", "Mengakses panel admin secara rahasia.", "success");
                                }} 
                                className="cursor-default select-none hover:text-brandGold/40 transition-all duration-300"
                            >
                                &copy; 2026 Griya Bugar Massage Profesional. Hak Cipta Dilindungi Undang-Undang.
                            </p>
                        </div>
                    </footer>

                    {/* MODAL SUCCESS BOOKING DISPATCH DETAIL */}
                    {successBooking && (
                        <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex justify-center items-center p-4">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 border border-brandGold/20 shadow-2xl relative">
                                <button onClick={() => setSuccessBooking(null)} className="absolute top-4 right-4 p-1.5 rounded-full hover:bg-slate-100 text-slate-400 transition-all"><X size={18} /></button>
                                <div className="text-center mb-5">
                                    <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-md shadow-emerald-100"><CheckCircle2 size={28} className="text-emerald-600" /></div>
                                    <h3 className="font-serif text-2xl font-bold text-slate-800">{currentLang === 'id' ? 'Draf Pesan Telah Siap!' : 'Message Draft Ready!'}</h3>
                                    <p className="text-xs text-slate-500 mt-1">{currentLang === 'id' ? 'Satu langkah lagi untuk melakukan konfirmasi pemesanan ke cabang Griya Bugar.' : 'One final step to submit and confirm your booking with Griya Bugar branch.'}</p>
                                </div>

                                <div className="bg-brandCream border border-brandGold/30 p-4 rounded-2xl mb-4 text-center">
                                    <span className="text-[10px] font-bold text-brandBrown/60 uppercase tracking-widest block mb-1">
                                        {TRANSLATIONS[currentLang].booking_code_label}
                                    </span>
                                    <span className="font-mono text-xl sm:text-2xl font-black text-brandBrown tracking-wider block">
                                        {successBooking.code}
                                    </span>
                                    <button 
                                        onClick={() => handleCopyBookingCode(successBooking.code)}
                                        className="mt-2 inline-flex items-center gap-1 text-[11px] text-brandGoldDark hover:text-brandBrown font-bold transition focus:outline-none"
                                    >
                                        <Copy size={12} /> {TRANSLATIONS[currentLang].btn_copy_code}
                                    </button>
                                </div>

                                <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200/80 mb-5 text-left">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 block">Isi Pesan WhatsApp:</p>
                                    <div className="text-xs font-mono text-slate-700 bg-white p-3 rounded-xl border border-slate-100 whitespace-pre-wrap leading-relaxed max-h-40 overflow-y-auto">{successBooking.messagePreview}</div>
                                </div>
                                <div className="space-y-3">
                                    <a href={successBooking.link} target="_blank" rel="noopener noreferrer" onClick={() => setSuccessBooking(null)} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl transition shadow-lg flex justify-center items-center gap-2 text-sm">
                                        Hubungkan ke WhatsApp Sekarang <ExternalLink size={14} />
                                    </a>
                                    <button onClick={() => setSuccessBooking(null)} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-2xl text-xs transition">Kembali, Ubah Data Booking</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Mount App to browser DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
